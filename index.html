<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jockey+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/styles.css">
    <title>MOTORANKED</title>
</head>
<body>
    <header class="header">
            <div class="header-title">
                <h1>MOTO<span>RANKED</span></h1>
            </div>
            <div class="header-baner">
                <img src="./assets/imagenes/baner.jpg" alt="banner-moto-ranked" class="baner-img">
                <h2 class="baner-texto">EL MEJORE MOTOS DE TRABAJO</h2>
            </div> 
    </header>
    <section class ="section-text">
        <div class ="section-text-div" >
            <p>Explora nuestra guía con las mejores motos de bajo cilindraje, perfectas para el trabajo, los viajes o las aventuras todo terreno.</p>
        </div>
    </section>


    <Section class="section-cards">
        <div>
            <div class="cards" id="motos125">
                <img src="./assets/imagenes/125.jpg" alt="" class="img-cards">
                <h3 class="cards-tittle">MEJORES 125cc</h3>
            </div>
            <div class="cards" id="motos160">
                <img src="./assets/imagenes/160.jpg" alt="" class="img-cards">
                <h3 class="cards-tittle">MEJORES 160cc</h3>
            </div>
            <div class="cards" id="motos200">
                <img src="./assets/imagenes/200.jpg" alt="" class="img-cards">
                <h3 class="cards-tittle">MEJORES 200cc</h3>
            </div>
        <div>
    </Section>
    <footer class="footer">
        <h2>MOTORANKED</h2>
        <h2>Nuestras redes</h2>
        <div class="footer-conteiner-img-redes">
            <img src="./assets/imagenes/facebook.png" alt="" class="footer-img-redes">
            <img src="./assets/imagenes/gorjeo.png" alt="" class="footer-img-redes">
            <img src="./assets/imagenes/instagram.png" alt="" class="footer-img-redes">
        </div>
    </footer>
    <script src="scripts/scriptRedirectorEnlaces.js"></script>
</body>
</html>
